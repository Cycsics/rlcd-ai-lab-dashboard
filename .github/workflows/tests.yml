name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r work/rlcd_companion/server/requirements.txt
      - run: python -m pytest -q
        working-directory: work/rlcd_companion/server
